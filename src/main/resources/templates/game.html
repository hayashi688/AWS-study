<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>S3の湖 | AWS学習RPG</title><link rel="stylesheet" th:href="@{/css/game.css}"><script defer th:src="@{/js/game.js}"></script></head>
<body><main>
<header><p class="eyebrow">AWS QUEST · <span id="progress" th:text="${question.stage + ' / ' + total}"></span></p><h1 id="area" th:text="${question.area}"></h1><p>冒険者の書を読み、敵の間違いを自分の言葉で正そう。</p></header>
<div class="columns">
<section class="panel battle" aria-labelledby="battle-title"><h2 id="battle-title">⚔ BATTLE</h2><h3 id="enemy-name" th:text="${question.enemy.name}">S3スライム</h3>
<div class="lake"><div class="slime" th:attr="aria-label=${question.enemy.name}" th:text="${question.enemy.face}"></div><div class="ripple"></div></div>
<div class="hp-label">HP <span id="hp-number" th:text="${question.enemy.maxHp}">100</span> / <span id="max-hp" th:text="${question.enemy.maxHp}">100</span></div>
<progress id="hp-bar" th:max="${question.enemy.maxHp}" th:value="${question.enemy.maxHp}" aria-label="敵のHP"></progress>
<blockquote id="enemy-statement" th:text="${question.enemy.statement}"></blockquote>
<div id="battle-result" role="status" aria-live="polite"></div>
<div id="clear" hidden><strong>✨ CLEAR! ✨</strong><p id="clear-message"></p><button id="next-stage" type="button" disabled>次のステージへ</button></div>
</section>
<aside class="panel guide"><h2>📖 冒険者の書</h2>
<div id="book-index"><h3 id="book-index-title" tabindex="-1">サービス一覧</h3><p>調べたいサービスを選んで、知識を確認しよう。</p><div id="service-list" class="service-list" aria-label="AWSサービス一覧"><p>サービスを読み込み中…</p></div></div>
<div id="book-detail" hidden><button id="book-back" type="button">← サービス一覧へ</button><p id="category" class="eyebrow"></p><h3 id="guide-title" tabindex="-1"></h3><p id="guide-body"></p><a id="official-doc" target="_blank" rel="noopener noreferrer">AWS公式ドキュメントを開く ↗</a><div id="answer-help" hidden><p id="prompt"></p><details><summary>今回の問題の回答例・判定方法</summary><p>AI未使用のため、回答例と同じ内容・語順で答えてください。空白・句点・末尾の「だ／です」は許容します。言い換えなど判定できない回答は再回答となります。</p><p id="sample-answer"></p></details></div></div>
</aside>
</div>
<section class="panel answer-panel"><form id="answer-form" th:attr="data-question-id=${question.id},data-answer-url=@{/api/battle/answer},data-questions-url=@{/api/battle/questions}"><label for="answer">あなたの回答</label><textarea id="answer" name="answer" required maxlength="2000" rows="3" placeholder="敵の間違いを正そう。"></textarea><div class="actions"><span>学習資料は何度でも読めます</span><button id="attack" type="submit">⚔ 攻撃する</button></div><p id="error" role="alert"></p></form></section>
<section id="game-clear" class="panel" hidden tabindex="-1"><h2>🏆 GAME CLEAR!</h2><p>全<span th:text="${total}"></span>問クリア！ AWSの冒険を完走しました。</p><button id="restart" type="button">最初から遊ぶ</button></section></main></body></html>
