<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>S3の湖 | AWS学習RPG</title><link rel="stylesheet" th:href="@{/css/game.css}"><script type="module" th:src="@{/js/game.js}"></script></head>
<body><main>
<header><p class="eyebrow">AWS QUEST · <span id="progress" th:text="${'クリア済み：0 / ' + total + '問'}"></span> · <span id="progress-rate">0%</span></p><h1 id="area" th:text="${question.area}"></h1><p>冒険者の書を読み、敵の間違いを自分の言葉で正そう。</p></header>
<div class="columns">
<section class="panel battle" aria-labelledby="battle-title"><h2 id="battle-title">⚔ BATTLE</h2><h3 id="enemy-name" th:text="${question.enemy.name}">S3スライム</h3>
<div class="lake"><div class="slime" th:attr="aria-label=${question.enemy.name}" th:text="${question.enemy.face}"></div><div class="ripple"></div></div>
<div class="hp-label">HP <span id="hp-number" th:text="${question.enemy.maxHp}">100</span> / <span id="max-hp" th:text="${question.enemy.maxHp}">100</span></div>
<progress id="hp-bar" th:max="${question.enemy.maxHp}" th:value="${question.enemy.maxHp}" aria-label="敵のHP"></progress>
<blockquote id="enemy-statement" th:text="${question.enemy.statement}"></blockquote>
<button id="show-question" type="button" hidden>敵の最初の発言を表示</button>
<div id="battle-result" role="status" aria-live="polite"></div>
<div id="clear" hidden><strong>✨ CLEAR! ✨</strong><p id="clear-message"></p><button id="next-stage" type="button" disabled>次の敵へ</button></div>
</section>
<aside class="panel guide"><h2>📖 冒険者の書</h2>
<div id="book-index"><h3 id="book-index-title" tabindex="-1">カテゴリ一覧</h3><p>カテゴリから調べたいサービスを選ぼう。</p><div id="category-list" class="service-list" aria-label="AWSカテゴリ一覧"><p>カテゴリを読み込み中…</p></div></div>
<div id="book-services" hidden><button id="services-back" type="button">← カテゴリ一覧へ</button><h3 id="category-title" tabindex="-1"></h3><div id="service-list" class="service-list" aria-label="AWSサービス一覧"></div></div>
<div id="book-sections" hidden><button id="sections-back" type="button">← サービス一覧へ</button><h3 id="service-title" tabindex="-1"></h3><div id="section-list" class="service-list"></div></div>
<div id="book-detail" hidden><button id="book-back" type="button">← 項目選択へ</button><p id="category" class="eyebrow"></p><h3 id="guide-title" tabindex="-1"></h3><div id="guide-entries"></div></div>
</aside>
</div>
<section class="panel answer-panel"><form id="answer-form" th:attr="data-question-id=${question.id},data-answer-url=@{/api/battle/answer},data-questions-url=@{/api/battle/dataset}"><label for="answer">あなたの回答</label><textarea id="answer" name="answer" required maxlength="2000" rows="3" placeholder="敵の間違いを正そう。"></textarea><div class="actions"><span>学習資料は何度でも読めます</span><button id="attack" type="submit">⚔ 攻撃する</button></div><div id="answer-help"><p id="prompt"></p><details><summary>回答例・判定方法</summary><p>指定キーワードが回答に含まれるか、回答例と一致すれば正解です。AIや意味解析は使用しません。</p><p id="sample-answer"></p></details></div><p id="error" role="alert"></p><p id="storage-notice" role="status"></p></form></section>
<section id="game-clear" class="panel" hidden tabindex="-1"><h2>🏆 GAME CLEAR!</h2><p>全<span th:text="${total}"></span>問クリア！ AWSの冒険を完走しました。</p><button id="restart" type="button">最初から遊ぶ</button></section></main></body></html>
